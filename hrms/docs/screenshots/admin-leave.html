<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRMS - Leave Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{200:'#bfdbfe',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-primary-900 text-white flex flex-col">
      <div class="p-5 border-b border-primary-800"><h1 class="text-xl font-bold">HRMS Admin</h1><p class="text-primary-300 text-sm mt-1">admin@gmail.com</p></div>
      <nav class="flex-1 p-3 space-y-1">
        <a class="block px-4 py-2.5 rounded-lg text-sm text-primary-200">Dashboard</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm text-primary-200">Employees</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm text-primary-200">Attendance</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium bg-primary-700 text-white">Leave</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm text-primary-200">Payroll</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm text-primary-200">Reports</a>
      </nav>
    </aside>
    <main class="flex-1 p-6">
      <h2 class="text-2xl font-bold mb-6">Leave Requests</h2>
      <div class="bg-white rounded-xl border overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-left">
            <tr>
              <th class="px-4 py-3">Employee</th><th class="px-4 py-3">Type</th><th class="px-4 py-3">From</th>
              <th class="px-4 py-3">To</th><th class="px-4 py-3">Days</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-t">
              <td class="px-4 py-3">Abi Kumar</td>
              <td class="px-4 py-3">Casual Leave</td>
              <td class="px-4 py-3">2026-10-21</td>
              <td class="px-4 py-3">2026-10-22</td>
              <td class="px-4 py-3">2</td>
              <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs bg-amber-100 text-amber-700">Pending</span></td>
              <td class="px-4 py-3 space-x-2">
                <span class="text-green-600 text-xs font-medium">Approve</span>
                <span class="text-red-600 text-xs font-medium">Reject</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
