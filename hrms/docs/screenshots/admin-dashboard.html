<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: { 50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } } } } }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-primary-900 text-white flex flex-col">
      <div class="p-5 border-b border-primary-800">
        <h1 class="text-xl font-bold">HRMS Admin</h1>
        <p class="text-primary-300 text-sm mt-1">admin@gmail.com</p>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium bg-primary-700 text-white">Dashboard</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium text-primary-200">Employees</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium text-primary-200">Attendance</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium text-primary-200">Leave</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium text-primary-200">Payroll</a>
        <a class="block px-4 py-2.5 rounded-lg text-sm font-medium text-primary-200">Reports</a>
      </nav>
      <div class="p-4 border-t border-primary-800">
        <span class="text-sm text-primary-200">Logout</span>
      </div>
    </aside>
    <main class="flex-1 p-6 max-w-7xl">
      <h2 class="text-2xl font-bold mb-6">Dashboard</h2>
      <div class="grid grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <div class="w-10 h-10 bg-blue-500 rounded-lg mb-3"></div>
          <p class="text-slate-500 text-sm">Total Employees</p>
          <p class="text-3xl font-bold mt-1">7</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <div class="w-10 h-10 bg-green-500 rounded-lg mb-3"></div>
          <p class="text-slate-500 text-sm">Present Today</p>
          <p class="text-3xl font-bold mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <div class="w-10 h-10 bg-amber-500 rounded-lg mb-3"></div>
          <p class="text-slate-500 text-sm">Pending Leaves</p>
          <p class="text-3xl font-bold mt-1">1</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
          <div class="w-10 h-10 bg-purple-500 rounded-lg mb-3"></div>
          <p class="text-slate-500 text-sm">Payroll This Month</p>
          <p class="text-3xl font-bold mt-1">0</p>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
        <h3 class="font-semibold mb-3">Employees by Department</h3>
        <div class="space-y-2">
          <div class="flex justify-between items-center py-2 border-b border-slate-50"><span>Engineering</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">2</span></div>
          <div class="flex justify-between items-center py-2 border-b border-slate-50"><span>Finance</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">1</span></div>
          <div class="flex justify-between items-center py-2 border-b border-slate-50"><span>Human Resources</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">1</span></div>
          <div class="flex justify-between items-center py-2 border-b border-slate-50"><span>Management</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">1</span></div>
          <div class="flex justify-between items-center py-2 border-b border-slate-50"><span>Marketing</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">1</span></div>
          <div class="flex justify-between items-center py-2"><span>Sales</span><span class="bg-primary-50 text-primary-700 px-3 py-0.5 rounded-full text-sm font-medium">1</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
