<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRMS Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{600:'#2563eb',700:'#1d4ed8',800:'#1e40af'}}}}}</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-800 to-primary-600 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-primary-800">HRMS</h1>
      <p class="text-slate-500 mt-1">Human Resource Management System</p>
    </div>
    <form class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" value="admin@gmail.com" class="w-full border border-slate-300 rounded-lg px-3 py-2" readonly />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" value="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2" readonly />
      </div>
      <button type="button" class="w-full bg-primary-600 text-white font-semibold py-2.5 rounded-lg">Sign In</button>
    </form>
    <div class="mt-6 text-xs text-slate-500 bg-slate-50 rounded-lg p-3">
      <p class="font-semibold mb-1">Demo accounts:</p>
      <p>Admin: admin@gmail.com / Admin@123</p>
      <p>HR: hr@gmail.com / Hr@12345</p>
      <p>Employees: abi / pradeesh / linga / rohith / sugan @gmail.com / Emp@12345</p>
    </div>
  </div>
</body>
</html>
